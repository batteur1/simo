<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMO – لوحة العمل</title>
<style>
body{font-family:system-ui,Tahoma,sans-serif;background:#fffaf0;color:#2A1E00;max-width:560px;margin:auto;padding:12px}
h1{background:linear-gradient(165deg,#FFD25A,#F5B82E 55%,#E39A0A);color:#2A1E00;margin:-12px -12px 12px;padding:16px;font-size:20px}h3{margin:14px 0 6px}
.c{background:#fff;border:1px solid #f1e3bd;border-radius:14px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid #ccd;border-radius:10px;margin:4px 0;font:inherit;box-sizing:border-box}
button{background:#2A1E00;color:#FFD25A;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;margin:3px 0}
button.o{background:#f1e3bd;color:#2A1E00}.r{display:flex;justify-content:space-between;align-items:center;gap:8px}small{color:#6b7690}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{flex:1;min-width:80px}
.im{display:flex;align-items:center;gap:8px}.im img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#f1e3bd}
.bt{display:inline-block;background:#f1e3bd;color:#2A1E00;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;font-size:14px}
details.c summary{font-weight:700;cursor:pointer}textarea{width:100%}label.f{display:block;font-size:13px;color:#6b7690;margin-top:6px}
.t{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#2A1E00;color:#FFD25A;z-index:99;padding:8px 16px;border-radius:16px}
</style></head><body><h1>SIMO • لوحة العمل</h1><div id="v"></div>
<script>
const $=i=>document.getElementById(i);
let tab="orders",sel=0,tok=localStorage.getItem("stok")||"",otp=0,ph="";
const SL={new:"جديد",accepted:"مقبول",ready:"جاهز",picked:"في الطريق",delivered:"تم التسليم",cancelled:"ملغى"};
const J=()=>{try{return JSON.parse(atob(tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))}catch(e){return{}}};
const msg=m=>{const d=document.createElement("div");d.className="t";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)};
const out=()=>{tok="";localStorage.removeItem("stok");draw()};
const api=(p,m,b)=>fetch(p,{method:m||"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:b?JSON.stringify(b):undefined}).then(r=>{if(r.status==401){out();throw 0}return r.json().catch(()=>({})).then(j=>{if(!r.ok)throw j;return j})});
const B=(l,f,o)=>`<button class="${o||""}" onclick="${f}">${l}</button>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const card=(o,a)=>{let it=[];try{it=JSON.parse(o.items)}catch(e){}return `<div class="c"><div class="r"><b>#${o.id}</b><span>${SL[o.status]||o.status}</span></div><small>${it.map(i=>i.qty+"× "+esc(i.name)).join("، ")}<br>${o.subtotal+o.fee-o.discount} MAD • ${o.pay_method||"cash"}<br>${esc(o.address)} • ${esc(o.phone)}</small><div>${a||""}</div></div>`};
const head=r=>`<div class="r"><b>${r}</b>${B("خروج","out()","o")}</div>`;
const st=(id,s)=>api("/orders/"+id+"/status","PATCH",{status:s}).then(draw).catch(e=>msg(e.error||"خطأ"));
const tg=(id,p,a)=>api("/items/"+id,"PUT",{price:p,available:a}).then(draw);
const cl=id=>api("/orders/"+id+"/claim","POST").then(draw).catch(()=>msg("سبقك موزع آخر"));
const tc=(id,a)=>api("/admin/cities/"+id,"PUT",{active:a}).then(draw);
const ts=(id,a)=>api("/admin/shops/"+id,"PUT",{active:a}).then(draw);
const sx=id=>api("/admin/payouts/"+id+"/settle","POST").then(draw);
const sr=()=>api("/admin/users","PUT",{phone:$("up").value.replace(/[\s.-]/g,""),role:$("ur").value,shop_id:+$("us").value||null}).then(()=>msg("تم — يعيد المستخدم تسجيل الدخول")).catch(()=>msg("خطأ"));

const none=t=>`<div class="c">${t}</div>`;
const CATS={Restaurants:"مطاعم",Courses:"بقالة",Boutiques:"متاجر",Parapharmacie:"صيدلية",Coursier:"توصيل طرود"};
const TB=l=>`<div class="tabs">${l.map(([k,t])=>`<button class="${tab==k?"":"o"}" onclick="tab='${k}';draw()">${t}</button>`).join("")}</div>`;
const rs=(f,max)=>new Promise((ok,no)=>{const i=new Image;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/jpeg",.82)};i.onerror=no;i.src=URL.createObjectURL(f)});
const pick=(el,id)=>{const f=el.files[0];if(!f)return;msg("جاري رفع الصورة…");rs(f,900).then(b=>fetch("/upload",{method:"POST",headers:{"Content-Type":"image/jpeg",Authorization:"Bearer "+tok},body:b})).then(r=>r.ok?r.json():Promise.reject()).then(r=>{$(id).value=r.url;const p=$(id+"p");p.src=r.url;p.style.display="";msg("تم رفع الصورة ✓ — اضغط حفظ")}).catch(()=>msg("فشل رفع الصورة"))};
const imgf=(id,v)=>`<div class="im"><img id="${id}p" src="${esc(v||"")}" ${v?"":'style="display:none"'}><input type="hidden" id="${id}" value="${esc(v||"")}"><label class="bt">📷 صورة<input type="file" accept="image/*" hidden onchange="pick(this,'${id}')"></label></div>`;
const val=i=>$(i).value;
const ok=m=>()=>{msg(m||"تم الحفظ ✓")};
const er=e=>msg((e&&e.error)||"خطأ");
// ---- المنتجات (تاجر + إدارة)
const itemRow=i=>`<div class="c"><div class="r">${imgf("i"+i.id,i.img)}<div style="flex:1"><input id="n${i.id}" value="${esc(i.name)}" placeholder="الاسم"><input id="p${i.id}" type="number" step="0.5" value="${i.price}" placeholder="السعر MAD"></div></div>
<select id="a${i.id}"><option value="1" ${i.available?"selected":""}>متوفر</option><option value="0" ${i.available?"":"selected"}>غير متوفر</option></select>
<div class="r">${B("حفظ","svI("+i.id+")")}${B("حذف","dlI("+i.id+")","o")}</div></div>`;
const svI=id=>api("/items/"+id,"PUT",{name:val("n"+id),price:+val("p"+id),available:+val("a"+id),img:val("i"+id)}).then(ok()).catch(er);
const dlI=id=>confirm("حذف هذا المنتج؟")&&api("/items/"+id,"DELETE").then(draw).catch(er);
const adI=()=>api("/items","POST",{shop_id:sel,name:val("nn"),price:+val("np"),img:val("nim")}).then(()=>{msg("تمت الإضافة ✓");draw()}).catch(er);
const newItem=`<details class="c"><summary>➕ إضافة منتج جديد</summary><input id="nn" placeholder="اسم المنتج"><input id="np" type="number" step="0.5" placeholder="السعر MAD">${imgf("nim","")}${B("إضافة","adI()")}</details>`;
// ---- المتاجر (إدارة)
const catSel=(id,v)=>`<select id="${id}">${Object.entries(CATS).map(([k,t])=>`<option value="${k}" ${k==v?"selected":""}>${t}</option>`).join("")}</select>`;
const citySel=(id,v,ct)=>`<select id="${id}">${ct.map(c=>`<option value="${c.id}" ${c.id==v?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`;
const shopForm=(x,ct)=>`<div class="c"><div class="r"><b>#${x.id}</b>${B(x.active?"ظاهر ✓":"مخفي","ts("+x.id+","+(x.active?0:1)+")",x.active?"":"o")}</div>${imgf("si"+x.id,x.img)}
<input id="sn${x.id}" value="${esc(x.name)}" placeholder="اسم المتجر">${catSel("sc"+x.id,x.category)}${citySel("sy"+x.id,x.city_id,ct)}
<input id="sf${x.id}" type="number" value="${x.fee}" placeholder="رسوم التوصيل MAD"><input id="sa${x.id}" value="${esc(x.address)}" placeholder="العنوان">${B("حفظ","svS("+x.id+")")}${B("منتجات","sel="+x.id+";tab='items';draw()","o")}</div>`;
const svS=id=>api("/admin/shops/"+id+"/info","PUT",{name:val("sn"+id),category:val("sc"+id),city_id:+val("sy"+id),fee:val("sf"+id),address:val("sa"+id),img:val("si"+id)}).then(ok()).catch(er);
const adS=()=>api("/admin/shops","POST",{name:val("xn"),category:val("xc"),city_id:+val("xy"),fee:val("xf"),address:val("xa"),img:val("xi")}).then(r=>{msg("تمت إضافة المتجر — رقمه "+r.id);draw()}).catch(er);
const adC=()=>api("/admin/cities","POST",{name:val("cn")}).then(draw).catch(er);
const adP=()=>api("/admin/promos","POST",{code:val("pc"),percent:+val("pp")}).then(draw).catch(er);
const tp=(c,a)=>api("/admin/promos/"+c,"PUT",{active:a}).then(draw);
const svC=()=>api("/admin/commission","PUT",{value:+val("cm")}).then(ok()).catch(er);
const svT=()=>api("/admin/settings","PUT",Object.fromEntries(["pay_cash","pay_card","pay_wallet","pay_cashplus","bank_name","bank_rib","bank_holder"].map(k=>[k,val("st_"+k)]))).then(ok()).catch(er);
const svM=()=>api("/merchant/shop","PUT",{name:val("mn"),address:val("ma"),img:val("mi")}).then(ok()).catch(er);
const onoff=(k,v,l)=>`<label class="f">${l}</label><select id="st_${k}"><option value="1" ${v=="1"?"selected":""}>مفعّل</option><option value="0" ${v=="1"?"":"selected"}>موقوف</option></select>`;
const ordersView=(o,btn)=>"<h3>الطلبات</h3>"+(o.map(btn).join("")||none("لا طلبات"));
const V={
client:()=>Promise.resolve(head("حساب زبون")+none('هذه الصفحة للتاجر والموزع والإدارة. الزبون يستعمل <a href="/">الصفحة الرئيسية</a>.')),
merchant:()=>Promise.all([api("/orders"),api("/merchant/items"),api("/merchant/shop")]).then(([o,it,sh])=>head("لوحة التاجر • "+esc(sh.name||""))+TB([["orders","الطلبات"],["items","المنتجات"],["shop","متجري"]])+
 (tab=="items"?newItem+it.map(itemRow).join(""):tab=="shop"?`<div class="c">${imgf("mi",sh.img)}<label class="f">اسم المتجر</label><input id="mn" value="${esc(sh.name)}"><label class="f">العنوان</label><input id="ma" value="${esc(sh.address)}">${B("حفظ","svM()")}</div>`:
 ordersView(o,x=>card(x,x.status=="new"?B("قبول","st("+x.id+",'accepted')"):x.status=="accepted"?B("جاهز للتسليم","st("+x.id+",'ready')"):"")))),
courier:()=>Promise.all([api("/orders/available"),api("/orders"),api("/courier/cash")]).then(([a,m,c])=>head("لوحة الموزع")+`<div class="c">نقد في يدك: <b>${c.due} MAD</b><br>أرباحك: <b>${(c.earned||0).toFixed(1)} MAD</b></div><h3>طلبات متاحة</h3>`+(a.map(x=>card(x,B("استلام الطلب","cl("+x.id+")"))).join("")||none("لا شيء الآن"))+"<h3>طلباتي</h3>"+m.map(x=>card(x,x.status=="picked"?B("تم التسليم","st("+x.id+",'delivered')"):"")).join("")),
admin:()=>Promise.all([api("/admin/stats"),api("/orders"),api("/admin/payouts"),api("/admin/shops"),api("/admin/cities"),api("/admin/promos"),api("/admin/settings"),api("/admin/users")]).then(([s,o,p,sh,ct,pr,se,us])=>{
 if(!sel&&sh[0])sel=sh[0].id;
 let h=head("لوحة الإدارة")+TB([["orders","الطلبات"],["shops","المتاجر"],["items","المنتجات"],["set","الإعدادات"]]);
 if(tab=="shops")h+=`<details class="c"><summary>➕ إضافة متجر جديد</summary>${imgf("xi","")}<input id="xn" placeholder="اسم المتجر">${catSel("xc","Restaurants")}${citySel("xy",ct.find(c=>c.active)?.id||1,ct)}<input id="xf" type="number" value="15" placeholder="رسوم التوصيل"><input id="xa" placeholder="العنوان">${B("إضافة","adS()")}</details>`+sh.map(x=>shopForm(x,ct)).join("");
 else if(tab=="items")h+=`<select onchange="sel=+this.value;draw()">${sh.map(x=>`<option value="${x.id}" ${x.id==sel?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`+newItem;
 else if(tab=="set")h+=`<div class="c"><b>عمولة المنصة %</b><input id="cm" type="number" value="${s.commission}">${B("حفظ","svC()")}</div>
 <div class="c"><b>طرق الدفع</b>${onoff("pay_cash",se.pay_cash,"الدفع عند الاستلام")}${onoff("pay_card",se.pay_card,"بطاقة بنكية")}${onoff("pay_wallet",se.pay_wallet,"محفظة إلكترونية")}${onoff("pay_cashplus",se.pay_cashplus,"CashPlus")}
 <label class="f">اسم البنك</label><input id="st_bank_name" value="${esc(se.bank_name)}"><label class="f">RIB</label><input id="st_bank_rib" value="${esc(se.bank_rib)}"><label class="f">صاحب الحساب</label><input id="st_bank_holder" value="${esc(se.bank_holder)}">${B("حفظ","svT()")}</div>
 <h3>المدن</h3>`+ct.map(x=>`<div class="c r"><span>${esc(x.name)}</span>${B(x.active?"مفعّلة ✓":"موقوفة","tc("+x.id+","+(x.active?0:1)+")",x.active?"":"o")}</div>`).join("")+`<div class="c"><input id="cn" placeholder="اسم مدينة جديدة">${B("إضافة مدينة","adC()")}</div><h3>أكواد الخصم</h3>`+
 pr.map(x=>`<div class="c r"><span>${esc(x.code)} — ${x.percent}% من رسوم التوصيل</span>${B(x.active?"فعّال ✓":"موقوف","tp('"+x.code+"',"+(x.active?0:1)+")",x.active?"":"o")}</div>`).join("")+`<div class="c"><input id="pc" placeholder="الكود (حروف/أرقام)"><input id="pp" type="number" placeholder="النسبة %">${B("إضافة كود","adP()")}</div>
 <h3>الفريق</h3>`+us.map(x=>`<div class="c"><b>${esc(x.phone)}</b> — ${x.role}${x.shop_id?" • متجر #"+x.shop_id:""}</div>`).join("")+`<div class="c"><b>تعيين دور</b><input id="up" placeholder="الهاتف 06…"><select id="ur"><option value="merchant">تاجر</option><option value="courier">موزع</option><option value="admin">إدارة</option><option value="client">زبون</option></select><select id="us"><option value="">— المتجر (للتاجر فقط) —</option>${sh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>${B("حفظ","sr()")}</div>`;
 else h+=`<div class="c">مسلّمة: <b>${s.delivered}</b> • المبيعات: <b>${s.gmv}</b> MAD • أرباح المنصة (${s.commission}%): <b>${s.revenue.toFixed(1)}</b> MAD</div><h3>محاسبة الموزعين</h3>`+(p.map(x=>`<div class="c r"><span>موزع #${x.courier_id}: ${x.n} طلب<br><small>نقد ${x.cash_collected} • حصته ${(x.courier_share||0).toFixed(1)} MAD</small></span>${B("تسوية","sx("+x.courier_id+")")}</div>`).join("")||none("لا شيء للتسوية"))+ordersView(o,x=>card(x,x.status!="delivered"&&x.status!="cancelled"?B("إلغاء","st("+x.id+",'cancelled')","o"):""));
 if(tab=="items")return api("/admin/items?shop_id="+sel).then(it=>h+it.map(itemRow).join(""));
 return h})
};
const lg=()=>`<div class="c"><b>تسجيل الدخول</b><input id="p" type="tel" placeholder="رقم الهاتف" value="${esc(ph)}">${otp?'<input id="k" inputmode="numeric" placeholder="الرمز (4 أرقام)">'+B("دخول","vf()"):B("إرسال الرمز","sd()")}<small>تجريبي: 0600000002 تاجر • 0600000003 موزع • 0600000004 إدارة</small></div>`;
const sd=()=>{ph=$("p").value.replace(/[\s.-]/g,"");fetch("/auth/otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:ph})}).then(r=>r.json().then(j=>r.ok?j:Promise.reject(j))).then(r=>{otp=1;if(r.dev)msg("الرمز: "+r.dev);draw()}).catch(e=>msg((e&&e.error)||"خطأ في الاتصال"))};
const vf=()=>fetch("/auth/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:ph,code:$("k").value.trim()})}).then(r=>r.ok?r.json():r.json().then(Promise.reject.bind(Promise))).then(r=>{tok=r.token;localStorage.setItem("stok",tok);otp=0;tab="orders";draw()}).catch(e=>msg((e&&e.error)||"رمز غير صحيح"));
function draw(){if(!tok){$("v").innerHTML=lg();return}(V[J().role]||V.client)().then(h=>$("v").innerHTML=h).catch(()=>{})}
draw();setInterval(()=>{if(tok&&tab=="orders"&&!document.activeElement.matches("input,select"))draw()},8000);
</script></body></html>
