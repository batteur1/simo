<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMO – لوحة العمل</title>
<style>
body{font-family:system-ui,Tahoma,sans-serif;background:#fffaf0;color:#2A1E00;max-width:560px;margin:auto;padding:12px}
h1{background:linear-gradient(165deg,#FFD25A,#F5B82E 55%,#E39A0A);color:#2A1E00;margin:-12px -12px 12px;padding:16px;font-size:20px}h3{margin:14px 0 6px}
.c{background:#fff;border:1px solid #f1e3bd;border-radius:14px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid #ccd;border-radius:10px;margin:4px 0;font:inherit;box-sizing:border-box}
button{background:#2A1E00;color:#FFD25A;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;margin:3px 0}
button.o{background:#f1e3bd;color:#2A1E00}.r{display:flex;justify-content:space-between;align-items:center;gap:8px}small{color:#6b7690}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{flex:1;min-width:80px}
.im{display:flex;align-items:center;gap:8px}.im img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#f1e3bd}
.bt{display:inline-block;background:#f1e3bd;color:#2A1E00;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;font-size:14px}
details.c summary{font-weight:700;cursor:pointer}textarea{width:100%}label.f{display:block;font-size:13px;color:#6b7690;margin-top:6px}
.t{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#2A1E00;color:#FFD25A;z-index:99;padding:8px 16px;border-radius:16px}
</style></head><body><h1>SIMO • لوحة العمل</h1><div id="v"></div>
<script>
const $=i=>document.getElementById(i);
let tab="orders",sel=0,tok=localStorage.getItem("stok")||"",otp=0,ph="";
const SL={new:"جديد",accepted:"مقبول",ready:"جاهز",picked:"في الطريق",delivered:"تم التسليم",cancelled:"ملغى"};
const J=()=>{try{return JSON.parse(atob(tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))}catch(e){return{}}};
const msg=m=>{const d=document.createElement("div");d.className="t";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)};
const out=()=>{if(window.LW){navigator.geolocation.clearWatch(LW);LW=0}tok="";localStorage.removeItem("stok");draw()};
const api=(p,m,b)=>fetch(p,{method:m||"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:b?JSON.stringify(b):undefined}).then(r=>{if(r.status==401){out();throw 0}return r.json().catch(()=>({})).then(j=>{if(!r.ok)throw j;return j})});
const B=(l,f,o)=>`<button class="${o||""}" onclick="${f}">${l}</button>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const card=(o,a)=>{let it=[];try{it=JSON.parse(o.items)}catch(e){}return `<div class="c"><div class="r"><b>#${o.id}</b><span>${SL[o.status]||o.status}</span></div><small>${it.map(i=>i.qty+"× "+esc(i.name)).join("، ")}<br>${o.subtotal+o.fee-o.discount+(o.tip||0)} MAD${o.tip?" (بقشيش "+o.tip+")":""} • ${o.pay_method||"cash"}${o.delivery_code?" • كود "+o.delivery_code:""}${o.scheduled_for?"<br>⏰ مجدول: "+fd(o.scheduled_for):""}<br>${esc(o.address)} • ${esc(o.phone)}</small><div>${a||""}</div></div>`};
const head=r=>`<div class="r"><b>${r}</b><span style="display:flex;gap:6px">${B("🔔","pushOn()","o")}${B("خروج","out()","o")}</span></div>`;
const st=(id,s)=>api("/orders/"+id+"/status","PATCH",{status:s}).then(draw).catch(e=>msg(e.error||"خطأ"));
const tg=(id,p,a)=>api("/items/"+id,"PUT",{price:p,available:a}).then(draw);
const cl=id=>api("/orders/"+id+"/claim","POST").then(draw).catch(()=>msg("سبقك موزع آخر"));
const tc=(id,a)=>api("/admin/cities/"+id,"PUT",{active:a}).then(draw);
const ts=(id,a)=>api("/admin/shops/"+id,"PUT",{active:a}).then(draw);
const sr=()=>{const v=$("up").value.trim();return api("/admin/users","PUT",{...(v.includes("@")?{email:v}:{phone:v.replace(/[\s.-]/g,"")}),role:$("ur").value,shop_id:+$("us").value||null}).then(()=>msg("تم — يعيد المستخدم تسجيل الدخول")).catch(()=>msg("خطأ"))};

const fm=n=>(+n||0).toFixed(2);
const dv=id=>api("/orders/"+id+"/status","PATCH",{status:"delivered",code:val("dc"+id)}).then(()=>{msg("تم التسليم ✓");draw()}).catch(er);
const WS={pending:"قيد المعالجة",paid:"تم الدفع ✓",rejected:"مرفوض"};
const KL={sale:"مبيعات",commission:"عمولة",delivery_fee:"أجرة توصيل",delivery_margin:"هامش توصيل",tip:"بقشيش",cash_collected:"نقد محصَّل",cash_deposit:"إيداع نقدي",withdraw:"سحب",withdraw_refund:"إرجاع سحب",adjustment:"تعديل"};
const fd=t=>{try{return new Date(t).toLocaleString("fr-MA",{dateStyle:"short",timeStyle:"short"})}catch(e){return""}};
const svPay=()=>api("/wallet/payout","PUT",{method:val("wm"),details:val("wd_"),holder:val("wh")}).then(()=>{msg("تم حفظ بيانات الاستلام ✓");draw()}).catch(er);
const wdr=()=>api("/wallet/withdraw","POST",{amount:+val("wa")}).then(()=>{msg("تم إرسال طلب السحب ✓");draw()}).catch(er);
const walletHTML=w=>{const b=w.balance,neg=b<0,p=w.payout||{};
 let h=(w.rating&&w.rating.n?`<div class="c r"><span>تقييمك من الزبائن</span><b>⭐ ${w.rating.avg} <small>(${w.rating.n})</small></b></div>`:"")+`<div class="c"><small>${neg?"عليك للمنصة (نقد في يدك)":"رصيدك القابل للسحب"}</small><div style="font-size:30px;font-weight:800;color:${neg?"#c0392b":"#1a7f37"}">${fm(Math.abs(b))} MAD</div>${neg?"<small>سلّم النقد للإدارة ليُسجَّل الإيداع ويصفّر الرصيد</small>":""}</div>`;
 h+=`<details class="c" ${p.payout_method?"":"open"}><summary>🏦 بيانات استلام الأموال ${p.payout_method?"✓":""}</summary>${p.payout_method?`<small>المسجَّل: ${p.payout_method=="bank"?"تحويل بنكي":"CashPlus"} — ${esc(p.payout_details)}</small>`:""}
 <select id="wm"><option value="bank" ${p.payout_method=="bank"?"selected":""}>تحويل بنكي (RIB)</option><option value="cashplus" ${p.payout_method=="cashplus"?"selected":""}>CashPlus (بالاسم والبطاقة الوطنية)</option></select>
 <input id="wd_" placeholder="RIB (24 رقمًا) أو الاسم + رقم البطاقة الوطنية"><input id="wh" placeholder="اسم صاحب الحساب (للبنك فقط)">${B("حفظ","svPay()")}</details>`;
 h+=neg?"":`<div class="c"><b>طلب سحب</b><input id="wa" type="number" inputmode="decimal" placeholder="المبلغ MAD (الحد الأدنى ${w.min})">${B("طلب سحب الرصيد","wdr()")}<small>تدفع الإدارة يدويًا وتؤكد الدفع هنا.</small></div>`;
 h+="<h3>طلبات السحب</h3>"+(w.wd.map(x=>`<div class="c r"><span>#${x.id} • ${fm(x.amount)} MAD<br><small>${fd(x.created)}${x.ref?" • "+esc(x.ref):""}</small></span><b>${WS[x.status]||x.status}</b></div>`).join("")||none("لا طلبات سحب"));
 h+="<h3>سجل الحركات</h3>"+(w.tx.map(x=>`<div class="c r"><span>${KL[x.kind]||x.kind}<br><small>${fd(x.ts)}${x.note?" • "+esc(x.note):""}</small></span><b style="color:${x.amount<0?"#c0392b":"#1a7f37"}">${x.amount>0?"+":""}${fm(x.amount)}</b></div>`).join("")||none("لا حركات بعد"));
 return h};
const wv=(title,tabs)=>api("/wallet").then(w=>head(title)+TB(tabs)+walletHTML(w));
// ---- المالية (إدارة)
let fr=new Date(Date.now()-29*864e5).toISOString().slice(0,10),to=new Date().toISOString().slice(0,10);
const setR=()=>{fr=val("ff")||fr;to=val("ft")||to;draw()};
const wpay=id=>api("/admin/withdrawals/"+id+"/pay","POST",{ref:val("wr"+id)}).then(()=>{msg("تم تأكيد الدفع ✓");draw()}).catch(er);
const wrej=id=>confirm("رفض الطلب وإرجاع المبلغ للرصيد؟")&&api("/admin/withdrawals/"+id+"/reject","POST",{reason:val("wr"+id)||"مرفوض"}).then(()=>{msg("تم الرفض وإرجاع المبلغ");draw()}).catch(er);
const dep=id=>api("/admin/ledger","POST",{type:"deposit",account:"courier",id,amount:+val("dp"+id)}).then(()=>{msg("تم تسجيل الإيداع ✓");draw()}).catch(er);
const adj=()=>api("/admin/ledger","POST",{type:"adjust",account:val("ja"),id:+val("ji"),amount:+val("jm"),note:val("jn")}).then(()=>{msg("تم التعديل ✓");draw()}).catch(er);
const csv=()=>fetch("/admin/ledger.csv?from="+fr+"&to="+to,{headers:{Authorization:"Bearer "+tok}}).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="simo-ledger-"+fr+"_"+to+".csv";document.body.appendChild(a);a.click();a.remove()}).catch(()=>msg("فشل التحميل"));
const kv=(l,v,c)=>`<div class="r" style="padding:4px 0;border-bottom:1px solid #f6edd2"><span>${l}</span><b ${c?`style="color:${c}"`:""}>${v}</b></div>`;
const finView=tabs=>Promise.all([api("/admin/accounting?from="+fr+"&to="+to),api("/admin/withdrawals"),api("/admin/wallets"),api("/admin/ratings"),api("/admin/audit")]).then(([a,w,wl,rt,au])=>{const P=a.platform,L=a.liabilities,O=a.orders,pend=w.filter(x=>x.status=="pending"),done=w.filter(x=>x.status!="pending").slice(0,8);
 let h=head("لوحة الإدارة")+TB(tabs);
 h+=`<h3>طلبات السحب المعلّقة (${pend.length})</h3>`+(pend.map(x=>`<div class="c"><div class="r"><b>${x.role=="merchant"?"تاجر: "+esc(x.shop||""):"موزع: "+esc(x.name||x.phone)}</b><b>${fm(x.amount)} MAD</b></div><small>${esc(x.phone||"")} • ${x.method=="bank"?"تحويل بنكي":"CashPlus"}<br>${esc(x.details)}<br>${fd(x.created)}</small><input id="wr${x.id}" placeholder="مرجع التحويل / سبب الرفض"><div class="r">${B("تم الدفع ✓","wpay("+x.id+")")}${B("رفض","wrej("+x.id+")","o")}</div></div>`).join("")||none("لا طلبات معلّقة"));
 if(done.length)h+=`<details class="c"><summary>آخر العمليات المنجزة</summary>${done.map(x=>kv("#"+x.id+" "+(x.role=="merchant"?esc(x.shop||""):esc(x.name||x.phone))+" • "+WS[x.status],fm(x.amount))).join("")}</details>`;
 h+="<h3>أرصدة الموزعين</h3>"+(wl.couriers.map(x=>`<div class="c"><div class="r"><span>${esc(x.name||x.phone)} <small>#${x.id} • ${x.deliveries} توصيلة</small></span><b style="color:${x.balance<0?"#c0392b":"#1a7f37"}">${x.balance<0?"عليه ":""}${fm(Math.abs(x.balance))}</b></div>${x.balance<0?`<div class="r"><input id="dp${x.id}" type="number" inputmode="decimal" placeholder="نقد مستلم MAD" value="${fm(-x.balance)}">${B("استلام نقد","dep("+x.id+")")}</div>`:""}</div>`).join("")||none("لا موزعين"));
 h+="<h3>أرصدة المتاجر</h3>"+(wl.shops.map(x=>`<div class="c r"><span>${esc(x.name)} <small>#${x.id}</small></span><b>${fm(x.balance)}</b></div>`).join("")||none("لا متاجر"));
 h+=`<details class="c"><summary>✏️ تعديل رصيد يدوي (مكافأة / خصم)</summary><select id="ja"><option value="courier">موزع</option><option value="shop">متجر</option></select><input id="ji" type="number" placeholder="رقم الموزع أو المتجر (#)"><input id="jm" type="number" step="0.5" placeholder="المبلغ (سالب للخصم)"><input id="jn" placeholder="السبب">${B("تسجيل","adj()")}</details>`;
 h+=`<h3>التقرير المحاسبي</h3><div class="c"><div class="r"><div style="flex:1"><label class="f">من</label><input id="ff" type="date" value="${a.from}"></div><div style="flex:1"><label class="f">إلى</label><input id="ft" type="date" value="${a.to}"></div></div>${B("تحديث","setR()")}${B("⬇ تحميل CSV","csv()","o")}</div>
 <div class="c"><b>الأرباح</b>${kv("طلبات مسلّمة",O.n)}${kv("قيمة المبيعات (المنتجات)",fm(O.sub))}${kv("رسوم التوصيل",fm(O.fee))}${kv("بقشيش المندوبين",fm(O.tip))}${kv("خصومات تتحملها المنصة",fm(O.disc))}${kv("عمولة المتاجر",fm(P.commission))}${kv("هامش التوصيل",fm(P.delivery_margin))}${kv("<b>صافي ربح المنصة</b>",fm(a.net),a.net<0?"#c0392b":"#1a7f37")}</div>
 <div class="c"><b>الالتزامات الحالية</b>${kv("مستحق للتجار",fm(L.shops))}${kv("مستحق للموزعين",fm(L.courier_owed))}${kv("نقد في يد الموزعين (له علينا)",fm(L.courier_debt),"#c0392b")}${kv("سحوبات معلّقة ("+L.pending_count+")",fm(L.pending_withdrawals))}</div>
 <h3>التقييمات</h3>`+(rt.shops.map(x=>kv(esc(x.name)+" <small>("+x.n+")</small>","⭐ "+x.avg)).concat(rt.couriers.map(x=>kv("🛵 "+esc(x.name)+" <small>("+x.n+")</small>","⭐ "+x.avg))).join("")||"<small>لا تقييمات بعد</small>")+`
 <details class="c"><summary>🛡️ سجل العمليات الحساسة</summary>${au.map(x=>kv(fd(x.ts)+" • "+esc(x.who||"")+"<br><small>"+esc(x.action)+" "+esc(x.detail||"")+"</small>","<small>"+esc(x.ip||"")+"</small>")).join("")||"<small>لا شيء</small>"}</details>
 <h3>يوميًا</h3>`+(a.days.map(d=>`<div class="c r"><span>${d.d}<br><small>${d.n} طلب</small></span><b>${fm(d.gmv)} MAD</b></div>`).join("")||none("لا طلبات في هذه الفترة"));
 return h});

let LW=0,LL=0;
const locStart=()=>{if(LW||!navigator.geolocation)return;LW=navigator.geolocation.watchPosition(p=>{const n=Date.now();if(n-LL<15000)return;LL=n;api("/courier/location","POST",{lat:p.coords.latitude,lng:p.coords.longitude}).catch(()=>{})},()=>{},{enableHighAccuracy:true,maximumAge:10000})};
const b64u=s=>{const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const pushOn=async()=>{try{if(!("serviceWorker"in navigator)||!window.PushManager)return msg("الإشعارات غير مدعومة على هذا الجهاز");const k=(await api("/push/key")).key;if(!k)return msg("الإشعارات غير مفعّلة على الخادم");if(await Notification.requestPermission()!="granted")return msg("لم يتم السماح بالإشعارات");const reg=await navigator.serviceWorker.register("/sw.js").then(()=>navigator.serviceWorker.ready);const sb=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k)});await api("/push/subscribe","POST",{...sb.toJSON(),lang:"ar"});msg("تم تفعيل الإشعارات ✓")}catch(e){msg("تعذّر تفعيل الإشعارات")}};

const none=t=>`<div class="c">${t}</div>`;
const CATS={Restaurants:"مطاعم",Courses:"بقالة",Boutiques:"متاجر",Parapharmacie:"صيدلية",Coursier:"توصيل طرود"};
const TB=l=>`<div class="tabs">${l.map(([k,t])=>`<button class="${tab==k?"":"o"}" onclick="tab='${k}';draw()">${t}</button>`).join("")}</div>`;
const rs=(f,max)=>new Promise((ok,no)=>{const i=new Image;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/jpeg",.82)};i.onerror=no;i.src=URL.createObjectURL(f)});
const pick=(el,id)=>{const f=el.files[0];if(!f)return;msg("جاري رفع الصورة…");rs(f,900).then(b=>fetch("/upload",{method:"POST",headers:{"Content-Type":"image/jpeg",Authorization:"Bearer "+tok},body:b})).then(r=>r.ok?r.json():Promise.reject()).then(r=>{$(id).value=r.url;const p=$(id+"p");p.src=r.url;p.style.display="";msg("تم رفع الصورة ✓ — اضغط حفظ")}).catch(()=>msg("فشل رفع الصورة"))};
const imgf=(id,v)=>`<div class="im"><img id="${id}p" src="${esc(v||"")}" ${v?"":'style="display:none"'}><input type="hidden" id="${id}" value="${esc(v||"")}"><label class="bt">📷 صورة<input type="file" accept="image/*" hidden onchange="pick(this,'${id}')"></label></div>`;
const val=i=>$(i).value;
const ok=m=>()=>{msg(m||"تم الحفظ ✓")};
const er=e=>msg((e&&e.error)||"خطأ");
// ---- المنتجات (تاجر + إدارة)
const itemRow=i=>`<div class="c"><div class="r">${imgf("i"+i.id,i.img)}<div style="flex:1"><input id="n${i.id}" value="${esc(i.name)}" placeholder="الاسم"><input id="p${i.id}" type="number" step="0.5" value="${i.price}" placeholder="السعر MAD"></div></div>
<select id="a${i.id}"><option value="1" ${i.available?"selected":""}>متوفر</option><option value="0" ${i.available?"":"selected"}>غير متوفر</option></select>
<div class="r">${B("حفظ","svI("+i.id+")")}${B("حذف","dlI("+i.id+")","o")}</div></div>`;
const svI=id=>api("/items/"+id,"PUT",{name:val("n"+id),price:+val("p"+id),available:+val("a"+id),img:val("i"+id)}).then(ok()).catch(er);
const dlI=id=>confirm("حذف هذا المنتج؟")&&api("/items/"+id,"DELETE").then(draw).catch(er);
const adI=()=>api("/items","POST",{shop_id:sel,name:val("nn"),price:+val("np"),img:val("nim")}).then(()=>{msg("تمت الإضافة ✓");draw()}).catch(er);
const newItem=`<details class="c"><summary>➕ إضافة منتج جديد</summary><input id="nn" placeholder="اسم المنتج"><input id="np" type="number" step="0.5" placeholder="السعر MAD">${imgf("nim","")}${B("إضافة","adI()")}</details>`;
// ---- المتاجر (إدارة)
const catSel=(id,v)=>`<select id="${id}">${Object.entries(CATS).map(([k,t])=>`<option value="${k}" ${k==v?"selected":""}>${t}</option>`).join("")}</select>`;
const citySel=(id,v,ct)=>`<select id="${id}">${ct.map(c=>`<option value="${c.id}" ${c.id==v?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`;
const shopForm=(x,ct)=>`<div class="c"><div class="r"><b>#${x.id}</b>${B(x.active?"ظاهر ✓":"مخفي","ts("+x.id+","+(x.active?0:1)+")",x.active?"":"o")}</div>${imgf("si"+x.id,x.img)}
<input id="sn${x.id}" value="${esc(x.name)}" placeholder="اسم المتجر">${catSel("sc"+x.id,x.category)}${citySel("sy"+x.id,x.city_id,ct)}
<input id="sf${x.id}" type="number" value="${x.fee}" placeholder="رسوم التوصيل MAD"><input id="sa${x.id}" value="${esc(x.address)}" placeholder="العنوان">${B("حفظ","svS("+x.id+")")}${B("منتجات","sel="+x.id+";tab='items';draw()","o")}</div>`;
const svS=id=>api("/admin/shops/"+id+"/info","PUT",{name:val("sn"+id),category:val("sc"+id),city_id:+val("sy"+id),fee:val("sf"+id),address:val("sa"+id),img:val("si"+id)}).then(ok()).catch(er);
const adS=()=>api("/admin/shops","POST",{name:val("xn"),category:val("xc"),city_id:+val("xy"),fee:val("xf"),address:val("xa"),img:val("xi")}).then(r=>{msg("تمت إضافة المتجر — رقمه "+r.id);draw()}).catch(er);
const adC=()=>api("/admin/cities","POST",{name:val("cn")}).then(draw).catch(er);
const adP=()=>api("/admin/promos","POST",{code:val("pc"),percent:+val("pp")}).then(draw).catch(er);
const tp=(c,a)=>api("/admin/promos/"+c,"PUT",{active:a}).then(draw);
const svC=()=>api("/admin/commission","PUT",{value:+val("cm")}).then(ok()).catch(er);
const svT=()=>api("/admin/settings","PUT",Object.fromEntries(["pay_cash","pay_card","pay_wallet","pay_cashplus","bank_name","bank_rib","bank_holder","courier_share","min_withdraw","min_order"].map(k=>[k,val("st_"+k)]))).then(ok()).catch(er);
const svM=()=>api("/merchant/shop","PUT",{name:val("mn"),address:val("ma"),img:val("mi")}).then(ok()).catch(er);
const onoff=(k,v,l)=>`<label class="f">${l}</label><select id="st_${k}"><option value="1" ${v=="1"?"selected":""}>مفعّل</option><option value="0" ${v=="1"?"":"selected"}>موقوف</option></select>`;
const ordersView=(o,btn)=>"<h3>الطلبات</h3>"+(o.map(btn).join("")||none("لا طلبات"));
const MT=[["orders","الطلبات"],["items","المنتجات"],["shop","متجري"],["wallet","المحفظة"]],CT=[["orders","الطلبات"],["wallet","محفظتي"]],AT=[["orders","الطلبات"],["fin","المالية"],["shops","المتاجر"],["items","المنتجات"],["set","الإعدادات"]];
const V={
client:()=>Promise.resolve(head("حساب زبون")+none('هذه الصفحة للتاجر والموزع والإدارة. الزبون يستعمل <a href="/">الصفحة الرئيسية</a>.')),
merchant:()=>tab=="wallet"?wv("لوحة التاجر",MT):Promise.all([api("/orders"),api("/merchant/items"),api("/merchant/shop")]).then(([o,it,sh])=>head("لوحة التاجر • "+esc(sh.name||""))+TB(MT)+
 (tab=="items"?newItem+it.map(itemRow).join(""):tab=="shop"?`<div class="c">${imgf("mi",sh.img)}<label class="f">اسم المتجر</label><input id="mn" value="${esc(sh.name)}"><label class="f">العنوان</label><input id="ma" value="${esc(sh.address)}">${B("حفظ","svM()")}</div>`:
 ordersView(o,x=>card(x,x.status=="new"?B("قبول","st("+x.id+",'accepted')"):x.status=="accepted"?B("جاهز للتسليم","st("+x.id+",'ready')"):"")))),
courier:()=>tab=="wallet"?wv("لوحة الموزع",CT):Promise.all([api("/orders/available"),api("/orders"),api("/wallet")]).then(([a,m,w])=>(m.some(x=>x.status=="picked")&&locStart(),head("لوحة الموزع"))+TB(CT)+`<div class="c r"><span>${w.balance<0?"نقد في يدك (عليك للمنصة)":"رصيدك القابل للسحب"}</span><b style="color:${w.balance<0?"#c0392b":"#1a7f37"}">${fm(Math.abs(w.balance))} MAD</b></div><h3>طلبات متاحة</h3>`+(a.map(x=>card(x,B("استلام الطلب","cl("+x.id+")"))).join("")||none("لا شيء الآن"))+"<h3>طلباتي</h3>"+m.map(x=>card(x,x.status=="picked"?`<input id="dc${x.id}" inputmode="numeric" maxlength="4" placeholder="كود التسليم من الزبون (4 أرقام)">`+B("تأكيد التسليم","dv("+x.id+")"):"")).join("")),
admin:()=>tab=="fin"?finView(AT):Promise.all([api("/admin/stats"),api("/orders"),api("/admin/shops"),api("/admin/cities"),api("/admin/promos"),api("/admin/settings"),api("/admin/users")]).then(([s,o,sh,ct,pr,se,us])=>{
 if(!sel&&sh[0])sel=sh[0].id;
 let h=head("لوحة الإدارة")+TB(AT);
 if(tab=="shops")h+=`<details class="c"><summary>➕ إضافة متجر جديد</summary>${imgf("xi","")}<input id="xn" placeholder="اسم المتجر">${catSel("xc","Restaurants")}${citySel("xy",ct.find(c=>c.active)?.id||1,ct)}<input id="xf" type="number" value="15" placeholder="رسوم التوصيل"><input id="xa" placeholder="العنوان">${B("إضافة","adS()")}</details>`+sh.map(x=>shopForm(x,ct)).join("");
 else if(tab=="items")h+=`<select onchange="sel=+this.value;draw()">${sh.map(x=>`<option value="${x.id}" ${x.id==sel?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`+newItem;
 else if(tab=="set")h+=`<div class="c"><b>عمولة المنصة على مبيعات المتجر %</b><input id="cm" type="number" value="${s.commission}">${B("حفظ","svC()")}</div>
 <div class="c"><b>الإعدادات المالية</b><label class="f">حصة الموزع من رسوم التوصيل %</label><input id="st_courier_share" type="number" value="${esc(se.courier_share||80)}"><label class="f">الحد الأدنى للسحب MAD</label><input id="st_min_withdraw" type="number" value="${esc(se.min_withdraw||100)}"><label class="f">الحد الأدنى لقيمة الطلب MAD</label><input id="st_min_order" type="number" value="${esc(se.min_order||0)}">${B("حفظ","svT()")}</div>
 <div class="c"><b>طرق الدفع</b>${onoff("pay_cash",se.pay_cash,"الدفع عند الاستلام")}${onoff("pay_card",se.pay_card,"بطاقة بنكية")}${onoff("pay_wallet",se.pay_wallet,"محفظة إلكترونية")}${onoff("pay_cashplus",se.pay_cashplus,"CashPlus")}
 <label class="f">اسم البنك</label><input id="st_bank_name" value="${esc(se.bank_name)}"><label class="f">RIB</label><input id="st_bank_rib" value="${esc(se.bank_rib)}"><label class="f">صاحب الحساب</label><input id="st_bank_holder" value="${esc(se.bank_holder)}">${B("حفظ","svT()")}</div>
 <h3>المدن</h3>`+ct.map(x=>`<div class="c r"><span>${esc(x.name)}</span>${B(x.active?"مفعّلة ✓":"موقوفة","tc("+x.id+","+(x.active?0:1)+")",x.active?"":"o")}</div>`).join("")+`<div class="c"><input id="cn" placeholder="اسم مدينة جديدة">${B("إضافة مدينة","adC()")}</div><h3>أكواد الخصم</h3>`+
 pr.map(x=>`<div class="c r"><span>${esc(x.code)} — ${x.percent}% من رسوم التوصيل</span>${B(x.active?"فعّال ✓":"موقوف","tp('"+x.code+"',"+(x.active?0:1)+")",x.active?"":"o")}</div>`).join("")+`<div class="c"><input id="pc" placeholder="الكود (حروف/أرقام)"><input id="pp" type="number" placeholder="النسبة %">${B("إضافة كود","adP()")}</div>
 <h3>الفريق</h3>`+us.map(x=>`<div class="c"><b>${esc(x.phone||x.email)}</b> — ${x.role}${x.shop_id?" • متجر #"+x.shop_id:""}</div>`).join("")+`<div class="c"><b>تعيين دور</b><input id="up" placeholder="الهاتف 06… أو البريد Gmail"><select id="ur"><option value="merchant">تاجر</option><option value="courier">موزع</option><option value="admin">إدارة</option><option value="client">زبون</option></select><select id="us"><option value="">— المتجر (للتاجر فقط) —</option>${sh.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>${B("حفظ","sr()")}</div>`;
 else h+=`<div class="c">مسلّمة: <b>${s.delivered}</b> • المبيعات: <b>${s.gmv}</b> MAD • صافي أرباح المنصة: <b>${(+s.revenue).toFixed(1)}</b> MAD<br><small>التفاصيل والسحوبات والتقارير في تبويب «المالية»</small></div>`+ordersView(o,x=>card(x,x.status!="delivered"&&x.status!="cancelled"?B("إلغاء","st("+x.id+",'cancelled')","o"):""));
 if(tab=="items")return api("/admin/items?shop_id="+sel).then(it=>h+it.map(itemRow).join(""));
 return h})
};
const lg=()=>`<div class="c"><b>تسجيل الدخول</b><input id="p" type="tel" placeholder="رقم الهاتف" value="${esc(ph)}">${otp?'<input id="k" inputmode="numeric" placeholder="الرمز (4 أرقام)">':""}<input id="pw" type="password" autocomplete="current-password" placeholder="كلمة سر الإدارة (للإدارة فقط)">${otp?B("دخول","vf()"):B("إرسال الرمز","sd()")}${GID?'<div style="text-align:center;margin:12px 0 4px"><small>أو</small></div><div id="gb" style="display:flex;justify-content:center"></div>':""}</div>`;
let GID="";fetch("/config").then(r=>r.json()).then(c=>{GID=c.google||"";if(!tok)draw()}).catch(()=>{});
const gInit=()=>{if(!GID||!$("gb"))return;const gr=()=>{try{google.accounts.id.initialize({client_id:GID,callback:r=>fetch("/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({credential:r.credential,password:($("pw")||{}).value||""})}).then(x=>x.ok?x.json():x.json().then(Promise.reject.bind(Promise))).then(x=>{tok=x.token;localStorage.setItem("stok",tok);otp=0;tab="orders";draw()}).catch(e=>msg((e&&e.error)||"فشل الدخول"))});google.accounts.id.renderButton($("gb"),{theme:"outline",size:"large",width:260,text:"continue_with"})}catch(e){}};if(window.google&&google.accounts)return gr();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=gr;document.head.appendChild(s)};
const sd=()=>{ph=$("p").value.replace(/[\s.-]/g,"");fetch("/auth/otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:ph})}).then(r=>r.json().then(j=>r.ok?j:Promise.reject(j))).then(r=>{otp=1;if(r.dev)msg("الرمز: "+r.dev);draw()}).catch(e=>msg((e&&e.error)||"خطأ في الاتصال"))};
const vf=()=>fetch("/auth/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:ph,code:$("k").value.trim(),password:$("pw").value})}).then(r=>r.ok?r.json():r.json().then(Promise.reject.bind(Promise))).then(r=>{tok=r.token;localStorage.setItem("stok",tok);otp=0;tab="orders";draw()}).catch(e=>msg((e&&e.error)||"رمز غير صحيح"));
function draw(){if(!tok){$("v").innerHTML=lg();setTimeout(gInit,0);return}(V[J().role]||V.client)().then(h=>$("v").innerHTML=h).catch(()=>{})}
draw();setInterval(()=>{if(tok&&tab=="orders"&&!document.activeElement.matches("input,select"))draw()},8000);
</script></body></html>
